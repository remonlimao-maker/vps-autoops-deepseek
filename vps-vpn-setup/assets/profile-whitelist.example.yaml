# Whitelist split-tunnel profile.
# Default is DIRECT; only the domains listed below use the VPN node.
# vpnctl sub --template will replace `proxies:` and every group's member list,
# keeping these rules and group names intact.

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver: ["223.5.5.5", "119.29.29.29"]
  # Proxied domains are resolved at the exit node; domestic names use CN DNS.
  nameserver: ["223.5.5.5", "119.29.29.29"]

proxies:

proxy-groups:
  - name: "🚀 节点选择"
    type: select
    proxies:
      - placeholder
  - name: "🎬 流媒体"
    type: select
    proxies:
      - placeholder
  - name: "🤖 AI服务"
    type: select
    proxies:
      - placeholder

rules:
  # ===== 1. Codex / ChatGPT / OpenAI =====
  - DOMAIN-SUFFIX,chatgpt.com,🤖 AI服务
  - DOMAIN-SUFFIX,openai.com,🤖 AI服务
